services:
  carnivorous-garden:
    build:
      context: .
      dockerfile: Dockerfile
    ports: 
      - 5005:5005
    volumes:
      - ./logs:/app/logs/
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
  
  alloy:
    build:
      context: .
      dockerfile: Dockerfile.alloy
    ports:
      - 12345:12345
      - 4317:4317
      - 4318:4318
    volumes:
      - ./logs:/app/logs:ro
      # Mounts the Docker daemon socket from the host into the container as read-only.
      # This allows Alloy to communicate with the Docker daemon to discover containers,
      # inspect their metadata, and read logs from Docker containers.
      # Required for Alloy's Docker service discovery and log collection features.
      - /var/run/docker.sock:/var/run/docker.sock:ro 
    env_file:
      - .env